# VoicePilot 명령 사전
#
# 명령 추가 방법
#   - id: 겹치지 않는 이름
#     action: 실행할 동작 이름 (현재 focus_window, focus_monitor, hide_window, launch_app, click, scroll 지원)
#     args: 동작에 넘길 고정 인자 (선택)
#     patterns: 말할 문장들. {이름}은 슬롯으로, 말한 내용에서 값을 뽑는다.
#
# - 띄어쓰기·문장부호는 무시하고, 조금 다르게 말해도 가장 비슷한 명령을 고른다.
# - 슬롯 값 끝의 조사("로", "으로", "에" 등)는 자동으로 떼어 낸다.
# - {index} 슬롯은 "1번", "두 번째" 같은 표현을 숫자로 바꾼다.

commands:
  # ---- 창 전환 ----
  # 창이 있으면 그 창으로 이동하고, 창이 아예 없으면 앱을 실행해서 보여 준다.
  - id: focus_window
    action: focus_window
    args: {launch_if_missing: true}
    patterns:
      - "{target} 넘어와"
      - "{target} 넘어가"
      - "{target} 가자"
      - "{target} 가줘"
      - "{target} 이동"
      - "{target} 전환"
      - "{target} 보여줘"
      - "{target} 띄워줘"
      - "{target} 창"
      - "{target} 열어줘"
      - "{target} 실행"
      - "{target} 실행해"
      - "{target} 실행해줘"
      - "{target} 켜"
      - "{target} 켜줘"
      - "{target} 시작해줘"

  # "포크 숨겨줘": 그 앱의 창을 모두 내린다(Cmd+H와 같음). 다시 보려면 "포크 열어줘". 닫기(종료)는 일부러 만들지 않았다.
  - id: hide_window
    action: hide_window
    patterns:
      - "{target} 숨겨"
      - "{target} 숨겨줘"
      - "{target} 내려"
      - "{target} 내려줘"
      - "{position} 화면에서 {target} 숨겨줘"
      - "{position} 모니터에서 {target} 숨겨줘"

  # "2번 모니터에서 fork 열어줘": 번호로 모니터를 지정한다. 아래 {position} 명령과 점수가 같을 때 번호가 이기도록 위에 둔다.
  - id: focus_window_on_monitor_index
    action: focus_window
    args: {launch_if_missing: true}
    patterns:
      - "{index} 화면 {target} 열어줘"
      - "{index} 화면에서 {target} 열어줘"
      - "{index} 모니터 {target} 열어줘"
      - "{index} 모니터에서 {target} 열어줘"

  # "오른쪽 화면 크롬 열어줘": 그 모니터에 있는 창으로만 찾는다.
  - id: focus_window_on_monitor
    action: focus_window
    args: {launch_if_missing: true}
    patterns:
      - "{position} 화면 {target} 열어줘"
      - "{position} 화면에서 {target} 열어줘"
      - "{position} 화면의 {target} 열어줘"
      - "{position} 모니터 {target} 열어줘"
      - "{position} 모니터에서 {target} 열어줘"
      - "{position} 모니터의 {target} 열어줘"

  # "크롬 화면에서 npm 열어줘" / "오른쪽 크롬 화면에서 구글지도 열어줘": 그 앱의 여러 창 중 제목에 target이 들어 있는 창으로 이동한다.
  # 앱 안에서 창을 고르는 것이라 꺼진 앱을 실행하지 않는다. "{position} 화면에서 {target}"과 점수가 같을 때 그쪽이 이기도록 아래에 둔다.
  - id: focus_app_window_on_monitor
    action: focus_window
    patterns:
      - "{position} {app} 화면에서 {target} 열어줘"
      - "{position} {app} 창에서 {target} 열어줘"
      - "{position} {app}에서 {target} 열어줘"

  - id: focus_app_window
    action: focus_window
    patterns:
      - "{app} 화면에서 {target} 열어줘"
      - "{app} 창에서 {target} 열어줘"
      - "{app}에서 {target} 열어줘"

  # ---- 모니터 전환 ----
  # "{target} 넘어와"와 겹치지 않도록 자주 쓰는 문장을 통째로 적어 둔다.
  - id: monitor_left
    action: focus_monitor
    args: {position: left}
    patterns:
      - "왼쪽 화면"
      - "왼쪽 모니터"
      - "왼쪽 화면으로 넘어와"
      - "왼쪽 화면으로 가줘"
      - "왼쪽 모니터로 넘어와"
      - "왼쪽 모니터로 가줘"
      - "왼쪽으로 넘어와"

  - id: monitor_right
    action: focus_monitor
    args: {position: right}
    patterns:
      - "오른쪽 화면"
      - "오른쪽 모니터"
      - "오른쪽 화면으로 넘어와"
      - "오른쪽 화면으로 가줘"
      - "오른쪽 모니터로 넘어와"
      - "오른쪽 모니터로 가줘"
      - "오른쪽으로 넘어와"

  - id: monitor_center
    action: focus_monitor
    args: {position: center}
    patterns:
      - "가운데 화면"
      - "가운데 모니터"
      - "가운데 화면으로 넘어와"
      - "가운데 모니터로 넘어와"

  - id: monitor_main
    action: focus_monitor
    args: {position: main}
    patterns:
      - "메인 화면"
      - "메인 모니터"
      - "메인 모니터로 넘어와"

  - id: monitor_next
    action: focus_monitor
    args: {position: next}
    patterns:
      - "다음 화면"
      - "다음 모니터"
      - "다른 화면"
      - "다른 모니터"

  - id: monitor_index
    action: focus_monitor
    patterns:
      - "{index} 모니터"
      - "{index} 화면"
      - "{index} 모니터로 넘어와"
      - "{index} 화면으로 넘어와"

  # ---- 클릭·스크롤 (현재 커서 위치 기준) ----
  - id: click
    action: click
    patterns:
      - "클릭"
      - "클릭해"
      - "클릭해줘"
      - "눌러"

  - id: double_click
    action: click
    args: {count: 2}
    patterns:
      - "더블클릭"
      - "더블클릭해"
      - "더블 클릭해줘"

  - id: right_click
    action: click
    args: {button: right}
    patterns:
      - "우클릭"
      - "우클릭해"
      - "오른쪽 클릭"
      - "오른쪽 클릭해줘"

  - id: scroll_down
    action: scroll
    args: {direction: down}
    patterns:
      - "스크롤 내려"
      - "스크롤 내려줘"
      - "아래로 스크롤"
      - "아래로"

  - id: scroll_up
    action: scroll
    args: {direction: up}
    patterns:
      - "스크롤 올려"
      - "스크롤 올려줘"
      - "위로 스크롤"
      - "위로"

# 말로 부르는 이름 → 실제 앱 이름 또는 창 제목 후보
# 한글로 말해도 영어 앱 이름을 찾을 수 있게 연결해 둔다. 자유롭게 추가하세요.
aliases:
  클로드보드: ["ClaudeBoard", "Claude Board"]
  클로드: ["Claude"]
  크롬: ["Google Chrome", "Chrome"]
  사파리: ["Safari"]
  파인더: ["Finder"]
  터미널: ["Terminal", "iTerm2", "iTerm"]
  코드: ["Code", "Visual Studio Code"]
  브이에스코드: ["Code", "Visual Studio Code"]
  슬랙: ["Slack"]
  카톡: ["KakaoTalk"]
  카카오톡: ["KakaoTalk"]
  노션: ["Notion"]
  메모: ["Notes"]
  메일: ["Mail"]
  캘린더: ["Calendar"]
  피그마: ["Figma"]
  줌: ["zoom.us"]
  포크: ["Fork"]
  엔피엠: ["npm"]
  구글지도: ["Google Maps", "Google 지도", "지도"]
  에어비앤비: ["Airbnb"]
